# Runs the checks on GitHub's computers instead of the owner's laptop.
# - Every push to main: build, then the three test suites side by side (runtime, editor, server).
# - By hand (Actions → Tests → Run workflow), or from scripts/ci.mjs: the same, plus bots that play the
#   games to the end, each bot on its own computer at the same time. "bots" is all, none, or names
#   such as platform-levels,tower-levels. "ref" tests an earlier commit instead of main (to compare a bot
#   before and after a change); "repeat" plays each bot that many times, side by side.
name: Tests
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Bots {0} x{1} at {2}', inputs.bots, inputs.repeat, inputs.ref || 'main') || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      bots:
        description: 'Bots to play: all, none, or names (platform-levels,tower-levels,…)'
        default: all
      ref:
        description: 'Commit to test (empty: main)'
        default: ''
      repeat:
        description: 'How many times to play each bot'
        default: '1'

# A newer push makes the older run pointless: stop it and save the minutes. A run of an earlier commit
# (ref), or of other bots or repeats, is a group of its own, so it neither stops nor is stopped by the others.
concurrency:
  group: tests-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.bots }}-${{ inputs.repeat }}
  cancel-in-progress: true

# GitHub's computers draw the games more slowly than the laptop: the checks wait three times as long.
env:
  TIME_SCALE: 3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: built
          path: |
            dist
            dist-editor
          retention-days: 3

  test:
    # An earlier commit (ref) is tested for its bots only: its suites passed when it was made.
    if: inputs.ref == ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, editor.smoke, server.smoke, agent.smoke, contact.smoke, fixtures.smoke, stress.smoke, art.smoke, framing.smoke]
    name: test (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: built
      # The export server builds from the Android project, which holds a copy of the built player.
      - if: matrix.suite == 'server.smoke'
        run: npx cap copy android
      - run: node scripts/${{ matrix.suite }}.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.suite }}
          path: test-output
          retention-days: 7

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.bots != 'none'
    runs-on: ubuntu-latest
    outputs:
      bots: ${{ steps.pick.outputs.bots }}
    steps:
      - id: pick
        run: |
          all='platform adventure shooter puzzle physics rescue tower bricks runner hopper runner-levels hopper-levels bricks-levels platform-levels tower-levels adventure-levels'
          wanted='${{ inputs.bots }}'
          [ "$wanted" = all ] && wanted="$all"
          names=$(echo "$wanted" | tr ', ' '\n\n' | grep -v '^$')
          # With repeat 3, tower-levels becomes tower-levels.1, tower-levels.2 and tower-levels.3.
          repeat='${{ inputs.repeat }}'
          if [ "${repeat:-1}" -gt 1 ]; then names=$(for n in $names; do for i in $(seq "$repeat"); do echo "$n.$i"; done; done); fi
          echo "bots=$(echo "$names" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  bot:
    needs: [build, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(needs.plan.outputs.bots) }}
    name: bot (${{ matrix.bot }})
    # One go of up to an hour each: a game over three levels draws slowly here. (Run a bot again by hand
    # if it was unlucky.)
    env:
      BOT_MINUTES: 60
      BOT_TRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: built
      - run: node scripts/bots/all.mjs "$(echo '${{ matrix.bot }}' | cut -d. -f1)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-photos-${{ matrix.bot }}
          path: scripts/bots/out
          retention-days: 7
